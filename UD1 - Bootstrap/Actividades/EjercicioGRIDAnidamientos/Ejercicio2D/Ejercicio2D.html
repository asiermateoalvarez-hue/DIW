<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
    <body>
        <H1 class="text-primary border border-warning">Ejemplo1 - Asier Mateo</H1>

        <div class="container">
            <div class="row g-2 mb-2">
                <div class="col-8">
                <div class="row g-2 h-100">
                    <div class="col-8">
                    <div class="h-100 d-flex align-items-center justify-content-center text-center p-3 fw-bold rounded bg-danger bg-opacity-75">1.1 Destacado Principal</div>
                    </div>
                    <div class="col-4 d-flex flex-column gap-2">
                    <div class="flex-fill d-flex align-items-center justify-content-center text-center p-3 fw-bold rounded bg-primary bg-opacity-75 text-white">1.2 Subnoticia A</div>
                    <div class="flex-fill d-flex align-items-center justify-content-center text-center p-3 fw-bold rounded bg-info bg-opacity-75">1.3 Subnoticia B</div>
                    </div>
                </div>
                </div>

                <div class="col-4 d-flex flex-column gap-2">
                <div class="flex-fill d-flex align-items-center justify-content-center text-center p-3 fw-bold rounded bg-secondary bg-opacity-75 text-white">3.1 Publicidad Superior</div>
                <div class="d-flex gap-2 flex-fill">
                    <div class="flex-fill d-flex align-items-center justify-content-center text-center p-3 fw-bold rounded bg-primary bg-opacity-25 text-white">3.2 Mini A</div>
                    <div class="flex-fill d-flex align-items-center justify-content-center text-center p-3 fw-bold rounded bg-primary bg-opacity-25 text-white">3.3 Mini B</div>
                </div>
                </div>
            </div>

            <div class="row g-2">
                <div class="col-8">
                <div class="row g-2 h-100">
                    <div class="col-4">
                    <div class="h-100 d-flex align-items-center justify-content-center text-center p-3 fw-bold rounded bg-warning bg-opacity-75">2.1 Columna Vertical</div>
                    </div>
                    <div class="col-8 d-flex flex-column gap-2">
                    <div class="d-flex gap-2 flex-fill">
                        <div class="flex-fill d-flex align-items-center justify-content-center text-center p-3 fw-bold rounded bg-success bg-opacity-75 text-white">2.2.1 Card 1</div>
                        <div class="flex-fill d-flex align-items-center justify-content-center text-center p-3 fw-bold rounded bg-dark bg-opacity-75 text-white">2.2.2 Card 2</div>
                    </div>
                    <div class="flex-fill d-flex align-items-center justify-content-center text-center p-3 fw-bold rounded bg-secondary bg-opacity-75 text-white">2.3 Banner Ancho</div>
                    </div>
                </div>
                </div>

                <div class="col-4">
                <div class="h-100 d-flex align-items-center justify-content-center text-center p-3 fw-bold rounded bg-success bg-opacity-50 text-white">3.4 Lateral Inferior Largo</div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
