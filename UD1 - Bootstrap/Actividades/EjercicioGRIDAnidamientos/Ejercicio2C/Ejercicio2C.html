<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
    <body>
        <div class="container d-flex">
            <div class="row g-2">

                <div class="col-3">
                    <div class="h-100 bg-primary bg-opacity-75 text-white fw-bold rounded text-center d-flex align-items-center justify-content-center">
                        1.1 Sidebar Principal
                    </div>
                </div>

                <div class="col-9">
                    <div class="row g-2">

                        <div class="col-12">
                            <div class="py-2 bg-secondary text-white fw-bold bg-opacity-50 rounded text-center">
                                2.1 Header Superior (Width total)
                            </div>
                        </div>

                        <div class="col-8">
                            <div class="py-2 bg-success bg-opacity-75 rounded text-white fw-bold text-center">
                                3.1 Contenido Principal
                            </div>
                        </div>

                        <div class="col-4 d-flex flex-column gap-2">
                            <div class="py-2 bg-warning bg-opacity-75 fw-bold rounded text-center">
                                3.2.1 Widget A
                            </div>
                            <div class="py-2 bg-danger bg-opacity-75 rounded text-center text-white fw-bold">
                                3.2.2 Widget B
                            </div>
                        </div>

                        <div class="col-4">
                            <div class="py-2 bg-info bg-opacity-75 rounded text-center fw-bold">4.1 Footer 1</div>
                        </div>
                        <div class="col-4">
                            <div class="py-2 bg-dark bg-opacity-75 rounded text-center text-white fw-bold">4.2 Footer 2</div>
                        </div>
                        <div class="col-4">
                            <div class="py-2 bg-primary bg-opacity-75 rounded text-center text-white fw-bold">4.3 Footer 3</div>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
