<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
    <body>
        <div class="container">
            <div class="row">
                <div class="col-6 bg-danger bg-opacity-10">1.1</div>
                <div class="col-6 bg-danger bg-opacity-10">1.2</div>
            </div>

            <div class="row">
                <div class="col-6 bg-warning bg-opacity-10">2.1</div>

                <div class="col-3">
                    <div class="row">
                        <div class="bg-primary">2.2</div>
                        <div class="bg-success">3.1</div>
                        <div class="bg-secondary">4.1</div>
                    </div>
                </div>

                <div class="col-3">
                    <div class="row">
                        <div class="bg-primary bg-opacity-50">2.3</div>
                        <div class="bg-success bg-opacity-25">3.2</div>
                        <div class="bg-secondary bg-opacity-50">4.2</div>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-9">
                    <div class="row">
                        <div class="bg-info bg-opacity-10">5.1</div>
                        <div class="bg-info bg-opacity-25">6.1</div>
                        <div class="bg-info bg-opacity-50">7.1</div>
                    </div>
                </div>

                <div class="col-3 bg-warning bg-opacity-10">5.2</div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
