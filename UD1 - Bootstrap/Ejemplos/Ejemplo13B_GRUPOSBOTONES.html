<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo13B - Grupos Botones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
    <body>
        <div class="container">
            <H1 class="text-primary border border-warning">Ejemplo13 - GRUPOS DE BOTONES</H1>

            <div class="btn-group">
                <Button class="btn btn-outline-success">Aceptar</Button>
                <Button class="btn btn-outline-secondary">Cancelar</Button>
                <Button class="btn btn-outline-info">Más Información</Button>
            </div>

            <div class="btn-group-vertical">
                <Button class="btn btn-outline-success">Aceptar</Button>
                <Button class="btn btn-outline-secondary">Cancelar</Button>
                <Button class="btn btn-outline-info">Más Información</Button>
            </div>

            <div class="btn-group">
                <input type="checkbox" name="chckvalor1" id="chckvalor1" class="btn-check">
                <label for="chckvalor1" class="btn btn-outline-success">Valor 1</label>

                <input type="checkbox" name="chckvalor2" id="chckvalor2" class="btn-check">
                <label for="chckvalor2" class="btn btn-outline-secondary">Valor 2</label>

                <input type="checkbox" name="chckvalor3" id="chckvalor3" class="btn-check">
                <label for="chckvalor3" class="btn btn-outline-info">Valor 3</label>
            </div>

            <div class="btn-group">
                <input type="radio" name="chckvalor" id="chckvalor4" class="btn-check">
                <label for="chckvalor4" class="btn btn-outline-success">Valor 4</label>

                <input type="radio" name="chckvalor" id="chckvalor5" class="btn-check">
                <label for="chckvalor5" class="btn btn-outline-secondary">Valor 5</label>

                <input type="radio" name="chckvalor" id="chckvalor6" class="btn-check">
                <label for="chckvalor6" class="btn btn-outline-info">Valor 6</label>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    </body>
</html>
