<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo19 - Pop Over</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
    <body>
        

        <div class="container">
            <H1 class="text-primary border border-warning mb-5">Ejemplo19 - POPOVERS</H1>

            <Button class="btn btn-success my-4" data-bs-trigger="hover" data-bs-toggle="popover" data-bs-placement="top" data-bs-title="Hola Mundo!" data-bs-content="Este es el saludo que te envío."> Mostrar un Popover</Button>
            <Button class="btn btn-success mb-4" data-bs-toggle="popover" data-bs-placement="bottom" data-bs-title="Hola Mundo!" data-bs-content="Este es el saludo que te envío."> Mostrar un Popover</Button>
            <Button class="btn btn-success mb-4" data-bs-toggle="popover" data-bs-placement="left" data-bs-title="Hola Mundo!" data-bs-content="Este es el saludo que te envío."> Mostrar un Popover</Button>
            <Button class="btn btn-success mb-4" data-bs-toggle="popover" data-bs-placement="right" data-bs-title="Hola Mundo!" data-bs-content="Este es el saludo que te envío."> Mostrar un Popover</Button>
            <Button class="btn btn-success mb-4" data-bs-trigger="hover" data-bs-toggle="popover" data-bs-placement="right" data-bs-title="Hola Mundo!" data-bs-content="Este es el saludo que te envío."> Mostrar un Popover</Button>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

        <script src="./js/popover.js"></script>
    </body>
</html>
